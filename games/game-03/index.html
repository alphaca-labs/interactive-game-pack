<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>플레이트 스택 — 맨 위 접시만 집는 서빙 퍼즐</title>
<meta name="description" content="6줄로 쌓인 접시 중 맨 위 한 장만 집어 손님 주문을 채우는 60초 보드 퍼즐 데모. 외부 리소스 없이 단독 실행됩니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317110d'/%3E%3Cpath d='M16 6c3 3.6 4.6 6.2 4.6 8.6a4.6 4.6 0 0 1-9.2 0C11.4 12.2 13 9.6 16 6z' fill='%23ff9d4d'/%3E%3Cpath d='M16 14.5c1.4 1.7 2.1 2.9 2.1 4a2.1 2.1 0 1 1-4.2 0c0-1.1.7-2.3 2.1-4z' fill='%23ffe3b0'/%3E%3Crect x='8' y='23' width='16' height='2.6' rx='1.3' fill='%23c9a274'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <symbol id="dish-salmon" viewBox="0 0 24 24">
      <rect x="4.2" y="11.8" width="15.6" height="8" rx="3.2" fill="#f8f3e6" stroke="#d8cdb2" stroke-width="1"/>
      <path d="M3.4 12.4c0-2.7 3.2-4.8 8.6-4.8s8.6 2.1 8.6 4.8z" fill="#f2793f"/>

      <path d="M7.4 9.6c2.6-1 6.6-1 9.2 0" stroke="#ffe0cd" stroke-width="1" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="dish-onigiri" viewBox="0 0 24 24">
      <path d="M12 4.2c1.1 0 1.9.6 2.4 1.4l6.3 10.9c1.1 1.9 0 4-2.3 4H5.6c-2.3 0-3.4-2.1-2.3-4L9.6 5.6c.5-.8 1.3-1.4 2.4-1.4z" fill="#fbf7ec" stroke="#d6cbb3" stroke-width="1"/>
      <path d="M8.3 14.2h7.4v6.3H8.3z" fill="#2e3a45"/>

    <symbol id="dish-ebi" viewBox="0 0 24 24">
      <path d="M16.4 4.6 21.6 2.2l-1.4 5.6z" fill="#e0513c"/>
      <path d="M17.9 6.1c1.7 1.7 1.3 4.6-1 6.9l-5.7 5.7c-2 2-4.9 2.2-6.5.6s-1.4-4.5.6-6.5l5.7-5.7c2.3-2.3 5.2-2.7 6.9-1z" fill="#eda23a" stroke="#c47f26" stroke-width="1"/>
      <circle cx="9.4" cy="14.4" r="1" fill="#fbd189"/>
      <circle cx="13" cy="10.8" r="1" fill="#fbd189"/>
      <circle cx="6.9" cy="16.6" r="0.8" fill="#fbd189"/>
    </symbol>
    <symbol id="dish-maki" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.4" fill="#2e3a45"/>
      <circle cx="12" cy="12" r="6.5" fill="#fbf7ec"/>
      <circle cx="12" cy="12" r="3.3" fill="#3fa564"/>
      <circle cx="10.2" cy="10.6" r="1.1" fill="#f2793f"/>
      <circle cx="13.6" cy="13.3" r="0.9" fill="#f2793f"/>
    </symbol>
    <symbol id="dish-udon" viewBox="0 0 24 24">
      <path d="M6.4 9.2c1.6-2.4 3.6-3.6 5.6-3.6s4 1.2 5.6 3.6" stroke="#f7f1de" stroke-width="2.1" fill="none" stroke-linecap="round"/>
      <path d="M8.2 10.2c1.2-1.8 2.5-2.6 3.8-2.6s2.6.8 3.8 2.6" stroke="#efe6c9" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M3.2 11.2h17.6c0 5.1-3.9 8.8-8.8 8.8S3.2 16.3 3.2 11.2z" fill="#4f9ede" stroke="#356f9f" stroke-width="1"/>
      <path d="M5.6 13.4h12.8" stroke="#8fc4ee" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="9.1" cy="7.4" r="1.3" fill="#3fa564"/>
    </symbol>
    <symbol id="dish-gyudon" viewBox="0 0 24 24">
      <path d="M5.4 12.6c0-3.7 2.9-6 6.6-6s6.6 2.3 6.6 6z" fill="#f8f3e6" stroke="#d8cdb2" stroke-width="1"/>
      <path d="M7 11.6c1.2-1.7 3-2.6 5-2.6s3.8.9 5 2.6" stroke="#9b5127" stroke-width="2.1" fill="none" stroke-linecap="round"/>
      <path d="M8.6 9.4c1-1 2.1-1.5 3.4-1.5s2.4.5 3.4 1.5" stroke="#b76a37" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M3.2 12.4h17.6c0 5-3.9 8.6-8.8 8.6S3.2 17.4 3.2 12.4z" fill="#a9613a" stroke="#7f4525" stroke-width="1"/>
      <path d="M5.6 14.6h12.8" stroke="#c9865c" stroke-width="1.4" stroke-linecap="round"/>

      <path d="M16 17c5.2 0 9.2 3.1 10 8.2.3 1.9-1.1 3.4-3 3.4H9c-1.9 0-3.3-1.5-3-3.4C6.8 20.1 10.8 17 16 17z" fill="#5f6f86"/>

    <symbol id="cust-b" viewBox="0 0 32 32">
      <path d="M16 17c5.2 0 9.2 3.1 10 8.2.3 1.9-1.1 3.4-3 3.4H9c-1.9 0-3.3-1.5-3-3.4C6.8 20.1 10.8 17 16 17z" fill="#6b6480"/>

    <symbol id="coin" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.2" fill="#f2b429" stroke="#c98d12" stroke-width="1.4"/>
      <circle cx="12" cy="12" r="5.6" fill="#ffd463"/>

</svg>

<main class="shell" id="shell" aria-labelledby="gameTitle">

  <header class="hud">
    <div class="hud-id">
      <h1 id="gameTitle">플레이트 스택</h1>
      <p class="hud-sub" id="hudSub">맨 위 접시만 집을 수 있어요</p>
    </div>
    <div class="hud-stats">
      <div class="timer" id="timer">
        <svg viewBox="0 0 44 44" aria-hidden="true" focusable="false">
          <circle class="ring-bg" cx="22" cy="22" r="18"></circle>
          <circle class="ring-fg" id="timerRing" cx="22" cy="22" r="18"></circle>
        </svg>
        <span class="timer-num" id="timerNum">60</span>
      </div>
      <p class="coins" id="coinsBox">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#coin"></use></svg>
        <b id="coinsNum">0</b>
        <span class="combo" id="comboTag" hidden>×1.2</span>
      </p>
      <button type="button" class="icon-btn" id="muteBtn" aria-pressed="false">소리 켜기</button>
    </div>
  </header>

  <section class="counter" aria-label="카운터">
    <ul class="orders" id="orders">
      <li class="order-card" data-card="0">
        <svg class="cust" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#cust-a"></use></svg>
        <div class="order-body">
          <p class="order-name"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#dish-salmon"></use></svg><span data-role="name">—</span></p>
          <ul class="pips" data-role="pips">
            <li data-pip="0"></li><li data-pip="1"></li><li data-pip="2"></li>
          </ul>
        </div>
        <p class="order-coin"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#coin"></use></svg><span data-role="coin">0</span></p>
      </li>
      <li class="order-card" data-card="1">
        <svg class="cust" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><use href="#cust-b"></use></svg>
        <div class="order-body">
          <p class="order-name"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#dish-maki"></use></svg><span data-role="name">—</span></p>
          <ul class="pips" data-role="pips">
            <li data-pip="0"></li><li data-pip="1"></li><li data-pip="2"></li>
          </ul>
        </div>
        <p class="order-coin"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#coin"></use></svg><span data-role="coin">0</span></p>
      </li>
    </ul>
    <div class="queue-strip" id="queueStrip">
      <span class="queue-label">다음 손님</span>
      <ul class="queue-list" id="queueList"></ul>
      <span class="queue-more" id="queueMore"></span>
    </div>
  </section>

  <section class="tray-wrap" aria-labelledby="trayTitle">
    <p class="section-line">
      <span class="section-title" id="trayTitle">보관대</span>
      <span class="tray-free" id="trayFree">3칸 남음</span>
    </p>
    <ul class="tray" id="tray">
      <li class="tray-slot" data-slot="0"></li>
      <li class="tray-slot" data-slot="1"></li>
      <li class="tray-slot" data-slot="2"></li>
    </ul>
  </section>

  <section class="board-wrap" aria-labelledby="boardTitle">
    <h2 class="visually-hidden" id="boardTitle">접시 스택 6줄</h2>
    <div class="board" id="board" role="toolbar" aria-labelledby="boardTitle" aria-orientation="horizontal"></div>
  </section>

  <footer class="foot">
    <p class="status" id="status">시작을 누르면 60초가 흘러갑니다.</p>
    <div class="foot-actions">
      <button type="button" class="btn btn-primary" id="primaryBtn">시작</button>
      <a class="btn btn-ghost" id="ctaBtn" href="../../index.html">다른 데모 보기</a>
    </div>
  </footer>

  <div class="result" id="result" hidden>
    <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle" tabindex="-1" id="resultCard">
      <h2 id="resultTitle">라운드 종료</h2>
      <p class="result-reason" id="resultReason"></p>
      <dl class="result-stats">
        <div><dt>획득 코인</dt><dd id="resCoins">0</dd></div>
        <div><dt>서빙한 손님</dt><dd id="resServed">0</dd></div>
        <div><dt>시간 보너스</dt><dd id="resBonus">0</dd></div>
        <div><dt>최고 기록</dt><dd id="resBest">0</dd></div>
      </dl>
      <div class="result-actions">
        <button type="button" class="btn btn-primary" id="againBtn">다시 하기</button>
        <a class="btn btn-ghost" href="../../index.html">다른 데모 보기</a>
      </div>
    </div>
  </div>

  <div class="fx" id="fx" aria-hidden="true"></div>
</main>

<p class="visually-hidden" id="live" aria-live="polite" role="status"></p>

<script src="./script.js"></script>
</body>
</html>
